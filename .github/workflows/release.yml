name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Existing release tag to attach the image to (e.g. v1.2.3). Leave empty to upload as a workflow artifact only.'
        required: false
        type: string
        default: ''

# Pin the official Lite image. Bump URL + SHA together when Raspberry Pi
# publishes a new raspios_lite_arm64 release.
env:
  RASPIOS_URL: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-06-19/2026-06-18-raspios-trixie-arm64-lite.img.xz
  RASPIOS_SHA256: acff736ca7945e3b305f07cda4abdb870910e12634991da69783611756e381b3

jobs:
  # GITHUB_TOKEN tag pushes do not retrigger this workflow, so we create the
  # tag here and then run release/image in the same run.
  tag:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.match.outputs.created }}
      tag: ${{ steps.match.outputs.tag }}

    steps:
      - name: Match vx.x.x commit message
        id: match
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s\n' "$MESSAGE" | head -n1 | tr -d '\r' | sed 's/[[:space:]]*$//')
          if [[ "$SUBJECT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=${SUBJECT}" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Commit message is ${SUBJECT} — will create tag"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Commit message is not vx.x.x — skip tag"
          fi

      - name: Checkout
        if: steps.match.outputs.created == 'true'
        uses: actions/checkout@v4

      - name: Create and push tag
        if: steps.match.outputs.created == 'true'
        env:
          TAG: ${{ steps.match.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"

  release:
    needs: [tag]
    if: |
      always() && (
        github.ref_type == 'tag' ||
        (needs.tag.result == 'success' && needs.tag.outputs.created == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Resolve tag
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          CREATED_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${CREATED_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: wifi-setup-api/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      # ── Build Go API binary (linux/arm64) ────────────────────────────────────
      - name: Build wifi-setup-api
        working-directory: wifi-setup-api
        run: GOOS=linux GOARCH=arm64 go build -o wifi-setup-api .

      # ── Build React frontend ─────────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: wifi-setup
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: wifi-setup
        run: pnpm build

      - name: Package frontend dist
        working-directory: wifi-setup
        run: tar -czf ../wifi-setup-dist.tar.gz -C dist .

      # ── Create GitHub release with both artifacts ────────────────────────────
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            wifi-setup-api/wifi-setup-api
            wifi-setup-dist.tar.gz
          generate_release_notes: true

  image:
    needs: [release]
    if: |
      always() && (
        needs.release.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          ATTACH: ${{ inputs.attach_to_release }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "name=adspace-tv-${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_TAG" ]]; then
            echo "name=adspace-tv-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$ATTACH" ]]; then
            echo "name=adspace-tv-${ATTACH}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${ATTACH}" >> "$GITHUB_OUTPUT"
          else
            echo "name=adspace-tv-${SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Raspberry Pi OS Lite
        run: |
          curl -fL --retry 3 --retry-delay 5 -o raspios.img.xz "$RASPIOS_URL"
          echo "$RASPIOS_SHA256  raspios.img.xz" | sha256sum -c -

      - name: Decompress and embed
        env:
          IMG_NAME: ${{ steps.meta.outputs.name }}
        run: |
          mkdir -p images
          xz -T0 -dkc raspios.img.xz > "images/${IMG_NAME}.img"
          rm -f raspios.img.xz
          bash embed.sh "images/${IMG_NAME}.img" "images/${IMG_NAME}.img"
          xz -T0 "images/${IMG_NAME}.img"
          ls -lh "images/${IMG_NAME}.img.xz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: images/${{ steps.meta.outputs.name }}.img.xz
          if-no-files-found: error
          compression-level: 0

      - name: Attach image to release
        if: steps.meta.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: images/${{ steps.meta.outputs.name }}.img.xz
          fail_on_unmatched_files: true
